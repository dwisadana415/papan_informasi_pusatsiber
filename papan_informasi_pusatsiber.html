<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Papan Informasi Digital — Pusat Siber TNI AD</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04090f;
    --bg2: #07111e;
    --bg3: #0a1828;
    --accent: #00c6ff;
    --accent2: #0072ff;
    --gold: #f0b429;
    --green: #00e5a0;
    --red: #ff4d6d;
    --text: #cde4f8;
    --text-dim: #4a7a9b;
    --border: rgba(0,198,255,0.15);
    --glow: 0 0 20px rgba(0,198,255,0.2);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    position: relative;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,198,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,198,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridPan 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  /* Radar sweep top right */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(0,114,255,0.08) 0%, transparent 70%);
    border-radius: 50%;
    animation: pulse 4s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes gridPan { from { background-position: 0 0; } to { background-position: 60px 60px; } }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:0.5;} 50%{transform:scale(1.2);opacity:1;} }
  @keyframes scanline {
    0% { top: -2px; }
    100% { top: 100%; }
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  @keyframes glowPulse { 0%,100%{box-shadow: 0 0 10px rgba(0,198,255,0.2);} 50%{box-shadow: 0 0 25px rgba(0,198,255,0.5);} }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 1920px;
    height: 1080px;
    padding: 24px;
    display: grid;
    grid-template-rows: 100px 1fr 90px;
    gap: 16px;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 300px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .brand { display: flex; align-items: center; gap: 20px; }

  .logo {
    width: 72px;
    height: 72px;
    object-fit: contain;
  }

  .brand-text .name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .brand-text .sub {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-top: 3px;
  }

  .header-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,229,160,0.1);
    border: 0.5px solid rgba(0,229,160,0.3);
    border-radius: 20px;
    padding: 4px 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--green);
    letter-spacing: 2px;
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 1.5s ease-in-out infinite;
  }

  .clock-area { text-align: right; }

  .clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 52px;
    color: #fff;
    letter-spacing: 4px;
    line-height: 1;
    text-shadow: 0 0 30px rgba(0,198,255,0.4);
  }

  .clock-date {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 4px;
    text-align: right;
  }

  /* ── BODY ── */
  .body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr auto;
    gap: 16px;
  }

  .panel {
    background: linear-gradient(135deg, rgba(7,17,30,0.9), rgba(4,9,15,0.9));
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.6s ease both;
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  /* Scanline effect */
  .panel::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 40px;
    background: linear-gradient(transparent, rgba(0,198,255,0.03), transparent);
    animation: scanline 6s linear infinite;
    pointer-events: none;
  }

  .panel.wide {
    grid-column: 1 / -1;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 0.5px solid var(--border);
  }

  .panel-icon {
    width: 32px; height: 32px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .icon-jadwal { background: rgba(0,198,255,0.12); }
  .icon-notif { background: rgba(240,180,41,0.12); }
  .icon-kegiatan { background: rgba(0,229,160,0.12); }

  .panel-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .panel-count {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* Jadwal rows */
  .jadwal-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 0.5px solid rgba(255,255,255,0.05);
    animation: fadeIn 0.5s ease both;
  }

  .jadwal-row:last-child { border-bottom: none; }

  .jadwal-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    color: var(--accent);
    min-width: 52px;
    font-weight: 500;
  }

  .jadwal-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }

  .jadwal-text {
    font-size: 15px;
    color: var(--text);
    line-height: 1.4;
  }

  /* Pengumuman */
  .notif-item {
    padding: 10px 12px;
    border-left: 2px solid var(--gold);
    background: rgba(240,180,41,0.06);
    border-radius: 0 6px 6px 0;
    margin-bottom: 10px;
    animation: fadeIn 0.5s ease both;
  }

  .notif-item:last-child { margin-bottom: 0; }

  .notif-date {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .notif-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .panel.wide {
    grid-column: 1 / -1;
  }

  /* Kegiatan grid */
  .kegiatan-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .kg-item {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 12px;
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.6s ease both;
  }

  .kg-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1.5px;
    background: linear-gradient(90deg, var(--green), transparent);
  }

  .kg-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .kg-tgl {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--green);
    letter-spacing: 0.5px;
  }

  .kg-jam {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .kg-nama {
    font-size: 13px;
    color: #fff;
    font-weight: 500;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .badges { display: flex; flex-wrap: wrap; gap: 4px; }

  .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
    font-family: 'Exo 2', sans-serif;
    letter-spacing: 0.3px;
  }

  .b-dir { background: rgba(240,180,41,0.15); color: #f0c060; border: 0.5px solid rgba(240,180,41,0.3); }
  .b-kabag { background: rgba(0,198,255,0.15); color: #7bd4f8; border: 0.5px solid rgba(0,198,255,0.25); }
  .b-kasie { background: rgba(0,229,160,0.15); color: #55d9a0; border: 0.5px solid rgba(0,229,160,0.25); }

  /* ── FOOTER ── */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 0.5px solid var(--border);
    padding-top: 14px;
  }

  .footer-left {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .motto {
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-dim);
    font-style: italic;
    letter-spacing: 1px;
    text-align: center;
  }

  .motto span { color: var(--accent); }

  .footer-right {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-align: right;
  }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-family: 'Share Tech Mono', monospace;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 2px;
    animation: blink 1s infinite;
  }

  .error-msg {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--red);
    text-align: center;
    padding: 20px;
  }
</style>
</head>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx62H-IwBdZdcDjgZdoSWbbft6QbHyDzHfv8L0N4ao4dn-VEOTuNnLEu3JdT97phqvmsA/exec";

const DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];

function formatTgl(val) {
  if (!val) return '';
  // Handle ISO string like 2026-05-17T17:00:00.000Z
  if (typeof val === 'string' && val.includes('T')) {
    const d = new Date(val);
    return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()] + ' ' + d.getFullYear();
  }
  return val;
}

function formatJam(val) {
  if (!val) return '';
  // Handle ISO string for time
  if (typeof val === 'string' && val.includes('T')) {
    const d = new Date(val);
    return String(d.getUTCHours()).padStart(2,'0') + '.' + String(d.getUTCMinutes()).padStart(2,'0');
  }
  return val;
}

function pad(n){ return String(n).padStart(2,'0'); }

function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  document.getElementById('tgl').textContent = DAYS[now.getDay()]+', '+now.getDate()+' '+MONTHS[now.getMonth()]+' '+now.getFullYear();
}

function badgeClass(nama){
  const n = (nama||'').toLowerCase();
  if(n.includes('direktur')) return 'b-dir';
  if(n.includes('kabag')) return 'b-kabag';
  if(n.includes('kasie') || n.includes('kasi')) return 'b-kasie';
  return 'b-kabag';
}

function renderData(data){
  const body = document.getElementById('body');

  // Jadwal
  let jadwalHTML = `<div class="panel">
    <div class="panel-header">
      <div class="panel-icon icon-jadwal">📅</div>
      <div class="panel-title">Jadwal Hari Ini</div>
      <div class="panel-count">${data.jadwal.length} KEGIATAN</div>
    </div>`;
  if(data.jadwal.length === 0){
    jadwalHTML += `<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:20px;">Tidak ada jadwal</div>`;
  } else {
    data.jadwal.forEach(j => {
      jadwalHTML += `<div class="jadwal-row">
        <div class="jadwal-time">${formatJam(j.jam)}</div>
        <div class="jadwal-dot"></div>
        <div class="jadwal-text">${j.kegiatan}</div>
      </div>`;
    });
  }
  jadwalHTML += `</div>`;

  // Pengumuman
  let pengHTML = `<div class="panel">
    <div class="panel-header">
      <div class="panel-icon icon-notif">📢</div>
      <div class="panel-title">Pengumuman</div>
      <div class="panel-count">${data.pengumuman.length} INFO</div>
    </div>`;
  if(data.pengumuman.length === 0){
    pengHTML += `<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:20px;">Tidak ada pengumuman</div>`;
  } else {
    data.pengumuman.forEach(p => {
      pengHTML += `<div class="notif-item">
        <div class="notif-date">${formatTgl(p.tanggal)}</div>
        <div class="notif-text">${p.isi}</div>
      </div>`;
    });
  }
  pengHTML += `</div>`;

  // Kegiatan akan datang - panel full width
  let kegHTML = `<div class="panel wide">
    <div class="panel-header">
      <div class="panel-icon icon-kegiatan">🗓️</div>
      <div class="panel-title">Kegiatan Mendatang</div>
      <div class="panel-count">${data.kegiatan.length} AGENDA</div>
    </div>`;
  if(data.kegiatan.length === 0){
    kegHTML += `<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:20px;">Tidak ada kegiatan mendatang</div>`;
  } else {
    kegHTML += `<div class="kegiatan-grid">`;
    data.kegiatan.forEach(k => {
      const dihadiri = (k.dihadiri||'').split(',').map(d=>d.trim()).filter(Boolean);
      kegHTML += `<div class="kg-item">
        <div class="kg-top">
          <span class="kg-tgl">${formatTgl(k.tanggal)}</span>
          <span class="kg-jam">${formatJam(k.jam)}</span>
        </div>
        <div class="kg-nama">${k.nama}</div>
        <div class="badges">
          ${dihadiri.map(d=>`<span class="badge ${badgeClass(d)}">${d}</span>`).join('')}
        </div>
      </div>`;
    });
    kegHTML += `</div>`;
  }
  kegHTML += `</div>`;

  body.innerHTML = jadwalHTML + pengHTML + kegHTML;

  const now = new Date();
  document.getElementById('lastUpdate').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
}

async function fetchData(){
  try {
    const res = await fetch(API_URL + '?t=' + Date.now());
    const data = await res.json();
    renderData(data);
  } catch(e) {
    document.getElementById('body').innerHTML = `<div class="error-msg">⚠ GAGAL MEMUAT DATA — PERIKSA KONEKSI INTERNET</div>`;
  }
}

// Jalankan
updateClock();
setInterval(updateClock, 1000);
fetchData();
setInterval(fetchData, 60000); // refresh setiap 1 menit
</script>
</body>
</html>
